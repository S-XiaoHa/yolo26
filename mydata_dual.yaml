# DOTA8 dataset 8 images from split DOTAv1 dataset by Ultralytics
# Documentation: https://docs.ultralytics.com/datasets/obb/dota8/
# Example usage: yolo train model=yolov8n-obb.pt data=dota8.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── dota8  ← downloads here (1MB)

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /home/jzyh/code/yolo26_dual/data  # dataset root dir
train: images/train # train images (relative to 'path') 4 images
val: images/val # val images (relative to 'path') 4 images

# Dataset: 15 original classes = 5 shapes x 3 colors
# nc is the number of original dataset classes (labels in annotation files)
nc: 15

# Primary task: shape classification (5 classes)
# Mapping from model nc=5 to output channels:
#   0=round, 1=up, 2=left, 3=right, 4=turn_around
nc_shape: 5

# Secondary task: color classification (3 classes)
# Mapping from model ex_nc=3 to output channels:
#   0=red, 1=yellow, 2=green
ex_nc: 3
ex_names:
  0: red
  1: yellow
  2: green

# Original 15 classes (used in annotation files)
# Format: {shape}_{color}
#   shape: round(0-2), up(3-5), left(6-8), right(9-11), turn_around(12-14)
#   color: _red(0,3,6,9,12), _yellow(1,4,7,10,13), _green(2,5,8,11,14)
names:
  0: round_red
  1: round_yellow
  2: round_green
  3: up_red
  4: up_yellow
  5: up_green
  6: left_red
  7: left_yellow
  8: left_green
  9: right_red
  10: right_yellow
  11: right_green
  12: turn_around_red
  13: turn_around_yellow
  14: turn_around_green
